<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent K{% endblock %}</title>
<style>
  /* Self-contained: no CDN, no webfonts, no external assets. The demo must render
     identically on a laptop with no network, which is also the environment the
     whole zero-budget stack is built for. */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #dfe3e8;
    --text: #1c2024;
    --muted: #5f6b76;
    --accent: #3b5bdb;
    --ok-bg: #e7f6ec; --ok-fg: #1b6b3a; --ok-br: #9bd4b0;
    --warn-bg: #fff6e5; --warn-fg: #8a5300; --warn-br: #f0c67d;
    --info-bg: #eaeffd; --info-fg: #2b40a8; --info-br: #a9b9f2;
    --danger-bg: #fdecec; --danger-fg: #9c2323; --danger-br: #f0aaaa;
    --neutral-bg: #eef0f2; --neutral-fg: #4b545c; --neutral-br: #ccd2d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f24;
      --border: #2e333a;
      --text: #e8eaed;
      --muted: #9aa4ae;
      --accent: #8ea4ff;
      --ok-bg: #14301f; --ok-fg: #7fd6a0; --ok-br: #2c5c3e;
      --warn-bg: #33260d; --warn-fg: #f0c67d; --warn-br: #6a5222;
      --info-bg: #1b2246; --info-fg: #a9b9f2; --info-br: #37427e;
      --danger-bg: #3a1a1a; --danger-fg: #f0a5a5; --danger-br: #6e3232;
      --neutral-bg: #24282e; --neutral-fg: #b0b8c0; --neutral-br: #3a4048;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  code, .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.9em;
  }
  a { color: var(--accent); }

  header.top {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 24px;
  }
  header.top .wrap { max-width: 940px; margin: 0 auto; display: flex; align-items: baseline; gap: 14px; }
  header.top .brand { font-weight: 700; letter-spacing: -0.01em; }
  header.top .tagline { color: var(--muted); font-size: 13px; }
  header.top a { margin-left: auto; text-decoration: none; font-size: 14px; }

  main { max-width: 940px; margin: 0 auto; padding: 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card > h2 {
    margin: 0 0 14px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  /* Status banner. Tone is chosen in app/report.py, never in the template. */
  .banner { border-radius: 10px; border: 1px solid; padding: 16px 20px; margin-bottom: 18px; }
  .banner .label { font-size: 19px; font-weight: 700; }
  .banner .detail { margin-top: 6px; font-size: 14px; }
  .tone-ok      { background: var(--ok-bg);      color: var(--ok-fg);      border-color: var(--ok-br); }
  .tone-warn    { background: var(--warn-bg);    color: var(--warn-fg);    border-color: var(--warn-br); }
  .tone-info    { background: var(--info-bg);    color: var(--info-fg);    border-color: var(--info-br); }
  .tone-danger  { background: var(--danger-bg);  color: var(--danger-fg);  border-color: var(--danger-br); }
  .tone-neutral { background: var(--neutral-bg); color: var(--neutral-fg); border-color: var(--neutral-br); }

  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    border: 1px solid; font-size: 12px; font-weight: 600; white-space: nowrap;
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .table-scroll { overflow-x: auto; }

  dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  dl.meta dt { color: var(--muted); font-size: 13px; }
  dl.meta dd { margin: 0; }

  .pass, .fail { font-weight: 700; white-space: nowrap; }
  .pass { color: var(--ok-fg); }
  .fail { color: var(--danger-fg); }

  .empty { color: var(--muted); text-align: center; padding: 36px 12px; }

  footer { max-width: 940px; margin: 0 auto; padding: 8px 24px 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="brand">Agent K</span>
    <span class="tagline">evidence-backed incident response</span>
    <a href="/report">All investigations</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  Every claim on this page is backed by a resolvable SigNoz link, and every action
  passed a code-enforced policy gate.
</footer>
</body>
</html>
