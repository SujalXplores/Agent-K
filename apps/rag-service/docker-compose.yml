# Docker Compose for the monitored RAG service's PostgreSQL + pgvector
# Run: docker compose up -d postgres
#
# NOTE: The FastAPI app itself runs on the host during development
# (uvicorn app.main:app --reload) for faster iteration.
# Containerize the app only when ready (see Dockerfile).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentk-postgres
    environment:
      POSTGRES_USER: agentk
      POSTGRES_PASSWORD: agentk
      POSTGRES_DB: agentk
    ports:
      - "5432:5432"
    volumes:
      - agentk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentk-pgdata:
