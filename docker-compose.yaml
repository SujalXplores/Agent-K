services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: agentk
      POSTGRES_PASSWORD: agentk
      POSTGRES_DB: agentk
    ports:
      - "5432:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The monitored RAG service - the ONLY thing Agent K is ever allowed to act on.
  #
  # RAG_IMAGE_TAG is what a rollback actually changes. The deployer sidecar writes
  # the known-good tag into .env.deploy and re-creates this service, so "roll back"
  # means "re-create rag-app from the previous tag" and nothing more. Default is
  # v1-good so a plain `docker compose up` never starts the broken build by accident.
  rag-app:
    image: agent-k-rag:${RAG_IMAGE_TAG:-v1-good}
    container_name: rag-app
    depends_on:
      rag-postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://agentk:agentk@rag-postgres:5432/agentk
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SIGNOZ_URL: ${SIGNOZ_URL:-http://host.docker.internal:8080}
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      # Which MCP server Agent K spawns for evidence. Empty defaults to the real
      # ./signoz-mcp-server binary (app/signoz_mcp.py DEFAULT_MCP_COMMAND) - the
      # fixture is never the default, so a misconfigured stack fails loudly
      # rather than quietly serving hand-authored evidence. See DEMO.md.
      SIGNOZ_MCP_COMMAND: ${SIGNOZ_MCP_COMMAND:-}
      SIGNOZ_MCP_ARGS: ${SIGNOZ_MCP_ARGS:-}
      DEMO_RAG_URL: ${DEMO_RAG_URL:-}
      # Law 3 guardrail thresholds. Empty = the defaults in app/investigation.py;
      # tightening one makes that guardrail genuinely fire (LAW3-04/05).
      AGENT_K_LOOP_BREAKER_THRESHOLD: ${AGENT_K_LOOP_BREAKER_THRESHOLD:-}
      AGENT_K_TOKEN_BUDGET: ${AGENT_K_TOKEN_BUDGET:-}
      DEPLOYER_URL: http://deployer:9000
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:?DEPLOYER_TOKEN must be set}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: agent-k-rag-service
      # Empty in v1-good. The v2-broken image is this same image run with
      # AGENT_K_SEEDED_FLAGS=prompt_regression - see Dockerfile.
      AGENT_K_SEEDED_FLAGS: ${AGENT_K_SEEDED_FLAGS:-}

  # The Law 2 rollback executor (LAW2-03). THE ONLY container that gets the
  # Docker socket - Agent K itself must never be given one, which is what makes
  # "the action stays inside the permitted sandbox" a structural guarantee rather
  # than a promise Agent K makes about itself.
  deployer:
    build:
      context: .
      dockerfile: deployer/Dockerfile
    container_name: agent-k-deployer
    ports:
      - "9000:9000"
    volumes:
      # The privilege boundary, in one line. Nothing else in this project gets it.
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose file it re-creates from, plus somewhere to pin the image tag.
      - ./:/workspace
    environment:
      # REQUIRED. The sidecar refuses to serve /rollback at all without it (503) -
      # unlike the RAG app's /admin/flags, there is no unauthenticated mode here.
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:?DEPLOYER_TOKEN must be set}
      ROLLBACK_COMPOSE_FILE: /workspace/docker-compose.yaml
      ROLLBACK_TARGET_SERVICE: rag-app
      ROLLBACK_TARGET_CONTAINER: rag-app
      ROLLBACK_KNOWN_GOOD_TAG: ${ROLLBACK_KNOWN_GOOD_TAG:-v1-good}
      ROLLBACK_IMAGE_TAG_ENV_FILE: /workspace/.env.deploy
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: agent-k-deployer

volumes:
  rag-postgres-data:
