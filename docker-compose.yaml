services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: agentk
      POSTGRES_PASSWORD: agentk
      POSTGRES_DB: agentk
    ports:
      - "5432:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Law 2 rollback executor (LAW2-03). THE ONLY container that gets the
  # Docker socket - Agent K itself must never be given one, which is what makes
  # "the action stays inside the permitted sandbox" a structural guarantee rather
  # than a promise Agent K makes about itself.
  #
  # NOT YET RUNNABLE END-TO-END: `ROLLBACK_TARGET_SERVICE: rag-app` names a
  # service that does not exist in this file yet, because the RAG app is not
  # containerized (it runs via `uvicorn app.main:app`). Bringing this up will
  # start the sidecar and serve /healthz, but an actual rollback needs a
  # containerized rag-app with two versioned image tags. See RUNNING-AGENT-K.md
  # "Phase 6 human verification" for the exact remaining steps.
  deployer:
    build:
      context: .
      dockerfile: deployer/Dockerfile
    container_name: agent-k-deployer
    ports:
      - "9000:9000"
    volumes:
      # The privilege boundary, in one line. Nothing else in this project gets it.
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose file it re-creates from, plus somewhere to pin the image tag.
      - ./:/workspace
    environment:
      # REQUIRED. The sidecar refuses to serve /rollback at all without it (503) -
      # unlike the RAG app's /admin/flags, there is no unauthenticated mode here.
      DEPLOYER_TOKEN: ${DEPLOYER_TOKEN:?DEPLOYER_TOKEN must be set}
      ROLLBACK_COMPOSE_FILE: /workspace/docker-compose.yaml
      ROLLBACK_TARGET_SERVICE: rag-app
      ROLLBACK_TARGET_CONTAINER: rag-app
      ROLLBACK_KNOWN_GOOD_TAG: ${ROLLBACK_KNOWN_GOOD_TAG:-v1-good}
      ROLLBACK_IMAGE_TAG_ENV_FILE: /workspace/.env.deploy
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: agent-k-deployer

volumes:
  rag-postgres-data:
